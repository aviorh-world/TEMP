<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff70a6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>המשחקים שלי 🎈</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- פתיחה -->
<div id="splash" class="screen on">
  <div class="rainbow"></div>
  <div class="sun"></div>
  <div class="cloud" style="top:12vh;animation-duration:38s;animation-delay:-10s"></div>
  <div class="cloud" style="top:30vh;animation-duration:52s;animation-delay:-30s;scale:.7"></div>
  <div class="cloud" style="top:6vh;animation-duration:46s;animation-delay:-2s;scale:.55"></div>
  <span class="balloon-deco" style="left:8%;animation-duration:11s">🎈</span>
  <span class="balloon-deco" style="left:82%;animation-duration:14s;animation-delay:-6s">🎈</span>
  <span class="balloon-deco" style="left:30%;animation-duration:16s;animation-delay:-11s">🦋</span>
  <span class="balloon-deco" style="left:64%;animation-duration:12s;animation-delay:-3s">⭐</span>
  <h1 class="title" id="title"></h1>
  <div class="mascots"><span style="--i:0">🐶</span><span style="--i:1">🦄</span><span style="--i:2">🐱</span><span style="--i:3">🐰</span></div>
  <button id="go"><b>▶</b> בואי נשחק!</button>
</div>

<!-- תפריט -->
<div id="menu" class="screen">
  <div class="mhead">
    <button class="icon-btn" id="snd" aria-label="צליל">🔊</button>
    <button class="icon-btn" id="fs" aria-label="מסך מלא">⛶</button>
    <h1>המשחקים שלי <span>🎈</span></h1>
    <button class="icon-btn" id="tv" aria-label="הטלוויזיה שלי">📺</button>
    <div class="pill" id="mstars">⭐ <b>0</b></div>
  </div>
  <div class="tiles" id="tiles"></div>
</div>

<!-- משחק -->
<div id="game" class="screen">
  <div class="gbar">
    <button class="icon-btn" id="home" aria-label="חזרה">🏠</button>
    <div class="gtitle" id="gtitle"></div>
    <div class="pill" id="gstars">⭐ <b>0</b></div>
  </div>
  <div id="groot"></div>
</div>

<script src="audio/manifest.js"></script>
<script src="js/core.js"></script>
<script src="js/restaurant.js"></script>
<script src="js/shapes.js"></script>
<script src="js/letters.js"></script>
<script src="js/coloring.js"></script>
<script src="js/paint.js"></script>
<script src="js/cars.js"></script>
<script src="js/memory.js"></script>
<script src="js/princess.js"></script>
<script src="js/treats.js"></script>
<script src="js/dog.js"></script>
<script src="js/balloons.js"></script>
<script src="js/app.js"></script>
</body>
</html>
