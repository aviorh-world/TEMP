<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0b0c66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>הטלוויזיה שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --font:'Roboto','Noto Sans Hebrew',system-ui,sans-serif;
    --card:#212121; --chip:rgba(255,255,255,.1); --red:#ff0033;
    --nav:72px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;font-family:var(--font);color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html{background:#0b0c66}
  body{min-height:100vh;background:linear-gradient(180deg,#0b0c66 0%,#0d1384 35%,#1330c4 75%,#1a46e0 100%) fixed;
       padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px)}
  svg{display:block}
  button{font:inherit;color:inherit}

  /* ======================== top bar ======================== */
  .top{display:flex;align-items:center;gap:6px;padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 8px calc(10px + env(safe-area-inset-left))}
  .brand{display:flex;align-items:center;gap:8px;font:700 22px/1 var(--font);letter-spacing:-.3px;white-space:nowrap}
  .brand .logo{width:42px;height:30px;border-radius:9px;background:var(--red);display:grid;place-items:center;font-size:18px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
  .top .sp{flex:1}
  .ib{width:46px;height:46px;border:0;border-radius:50%;background:none;display:grid;place-items:center;cursor:pointer;text-decoration:none;color:#fff;font-size:24px}
  .ib:active{background:rgba(255,255,255,.12)}
  .ib svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* ======================== category chips ======================== */
  #chips{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:6px calc(16px + env(safe-area-inset-right)) 14px calc(16px + env(safe-area-inset-left));scroll-padding:16px}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:10px;height:52px;padding:0 20px 0 18px;border:0;border-radius:14px;cursor:pointer;
        background:var(--chip);color:#fff;font:600 17px/1 var(--font);white-space:nowrap;transition:background .15s}
  .chip .ci{font-size:24px;line-height:1}
  .chip.on{background:#f1f1f1;color:#0f0f0f}
  .chip:active{transform:scale(.97)}

  /* ======================== feed ======================== */
  .feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:18px;
        padding:4px calc(18px + env(safe-area-inset-right)) 8px calc(18px + env(safe-area-inset-left));max-width:1500px;margin:0 auto}
  .card{background:var(--card);border-radius:14px;padding:9px 9px 12px;cursor:pointer;transition:transform .12s;min-width:0}
  .card:active{transform:scale(.98)}
  .thumb{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#333}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .dur{position:absolute;left:8px;bottom:10px;background:rgba(0,0,0,.65);border-radius:6px;padding:3px 6px;font:500 14px/1 var(--font);direction:ltr}
  .prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.35)}
  .prog i{position:absolute;right:0;top:0;bottom:0;background:var(--red)}
  .meta{display:flex;align-items:flex-start;gap:6px;padding:10px 6px 0 0}
  .meta .t{flex:1;font:500 17px/1.32 var(--font);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta .t small{opacity:.7;font-weight:400;font-size:14px}
  .kebab{flex:0 0 auto;width:34px;height:34px;border:0;background:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;margin-top:-4px}
  .kebab svg{width:22px;height:22px;fill:#fff}
  .kebab:active{background:rgba(255,255,255,.12)}
  .empty{opacity:.8;padding:30px 10px;text-align:center;font-size:18px;grid-column:1/-1}
  .sect{font:700 20px var(--font);margin:6px calc(18px + env(safe-area-inset-right)) 12px}
  .more-btn{display:block;margin:18px auto 8px;border:0;border-radius:24px;padding:12px 26px;background:var(--chip);font:600 16px var(--font);cursor:pointer}

  /* search */
  #searchbox{display:flex;align-items:center;gap:10px;margin:4px calc(16px + env(safe-area-inset-right)) 16px calc(16px + env(safe-area-inset-left));background:rgba(255,255,255,.12);border-radius:28px;padding:0 18px;height:54px}
  #searchbox svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2}
  #q{flex:1;background:none;border:0;outline:0;color:#fff;font:500 18px var(--font);min-width:0}
  #q::placeholder{color:rgba(255,255,255,.6)}

  /* ======================== bottom nav ======================== */
  .bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;align-items:center;
        height:calc(var(--nav) + env(safe-area-inset-bottom));padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        background:rgba(15,15,15,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .bn{flex:1;max-width:160px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:rgba(255,255,255,.75);font:500 13px var(--font)}
  .bn svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
  .bn.on{color:#fff}
  .bn.on svg{fill:#fff;stroke:#fff}
  .bn .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:radial-gradient(circle at 30% 30%,#ffe066,#ff7eb6 60%,#7b5cff)}

  /* ======================== player (watch screen, like the app) ======================== */
  #player{position:fixed;inset:0;z-index:50;display:none;background:#000;overflow:hidden;--rowh:min(27vh,26vw)}
  #player.open{display:block}
  /* video area: full screen; shrinks to the top when the child taps and more videos appear underneath */
  #vid{position:absolute;left:0;right:0;top:0;bottom:0;background:#000;overflow:hidden;transition:bottom .28s cubic-bezier(.2,.8,.2,1)}
  #yt-box,#yt-box iframe,#yt{position:absolute;inset:0;width:100%;height:100%;border:0}
  #yt-box iframe{pointer-events:none}
  #cover{position:absolute;inset:0;background:#000 center/contain no-repeat;opacity:0;transition:opacity .2s;pointer-events:none}
  #player:not(.playing) #cover{opacity:1}
  #tap{position:absolute;inset:0;z-index:2;cursor:pointer}

  #ctl{position:absolute;inset:0;z-index:3;opacity:0;pointer-events:none;transition:opacity .2s;background:rgba(0,0,0,.35)}
  #player.ui #ctl{opacity:1}
  #player.ui #ctl .c{pointer-events:auto}
  .cbtn{border:0;background:none;cursor:pointer;display:grid;place-items:center;border-radius:50%;padding:0}
  .cbtn svg{fill:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
  .cbtn:active{background:rgba(255,255,255,.15)}
  /* top: back arrow, category "avatar", title */
  .ctop{position:absolute;top:0;right:0;left:0;display:flex;align-items:center;gap:12px;
        padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left))}
  #close{width:50px;height:50px;flex:0 0 auto}
  #close svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .av2{width:48px;height:48px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:26px;background:var(--cc,#7b5cff);box-shadow:0 0 0 2px rgba(255,255,255,.25)}
  .ttl{min-width:0;flex:1}
  #ptitle{font:500 18px/1.25 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  #pcat{font:400 14px/1.3 var(--font);opacity:.75;margin-top:2px}
  /* next video (left, middle) */
  #next{position:absolute;left:calc(18px + env(safe-area-inset-left));top:50%;width:60px;height:60px;margin-top:-30px}
  #next svg{width:42px;height:42px}
  #player.norecs #next{display:none}
  /* bottom row: full screen, play/pause, time, bar, length */
  .cbot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;direction:ltr;
        padding:0 calc(16px + env(safe-area-inset-right)) 8px calc(14px + env(safe-area-inset-left));font:500 16px var(--font);font-variant-numeric:tabular-nums;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .cbot .cbtn{width:48px;height:48px;flex:0 0 auto}
  .cbot .cbtn svg{width:34px;height:34px}
  #pp svg{width:40px;height:40px}
  #bar{position:relative;flex:1;height:40px;cursor:pointer;touch-action:none;margin:0 6px}
  #bar .track{position:absolute;left:0;right:0;top:50%;height:10px;margin-top:-5px;border-radius:6px;background:#fff;overflow:hidden}
  #fill{height:100%;width:0;background:var(--red)}
  #knob{position:absolute;top:50%;left:0;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.45);transition:transform .1s}
  #knob::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--red)}
  #bar:active #knob{transform:scale(1.2)}

  #loading{position:absolute;inset:0;z-index:4;display:none;place-items:center;pointer-events:none}
  #loading.show{display:grid}
  #loading i{width:46px;height:46px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #over{position:absolute;inset:0;z-index:4;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.75);text-align:center;padding:16px;font:500 18px/1.4 var(--font)}
  #over.show{display:flex}
  #over .e{font-size:44px;line-height:1}

  /* more videos: thumbnails only, like the app */
  .tcard{position:relative;border:0;padding:0;border-radius:12px;overflow:hidden;cursor:pointer;background:#222;aspect-ratio:16/9;display:block}
  .tcard img{width:100%;height:100%;object-fit:cover;display:block}
  .tcard:active{transform:scale(.97)}
  #more{position:absolute;left:0;right:0;bottom:0;z-index:1;display:none}
  #more h4{display:none;margin:0;font:700 22px var(--font)}
  #mlist{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:0 calc(18px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}
  #mlist::-webkit-scrollbar{display:none}
  #mlist .tcard{flex:0 0 auto;height:var(--rowh)}

  /* landscape: tap -> video moves up, row of thumbnails underneath */
  @media (orientation:landscape){
    #player.ui:not(.norecs) #vid{bottom:calc(var(--rowh) + 22px + env(safe-area-inset-bottom))}
    #player.ui:not(.norecs) #more{display:block}
  }
  /* portrait: controls + video on top, "more videos" list below */
  @media (orientation:portrait){
    #player{overflow-y:auto}
    #vid{position:sticky;bottom:auto;height:max(56.25vw,44vh);z-index:2}
    #player.ui #ctl{background:rgba(0,0,0,.45)}
    #more{position:static;display:block;padding:22px 0 30px}
    #player.norecs #more{display:none}
    #more h4{display:block;margin:0 calc(22px + env(safe-area-inset-right)) 18px}
    #mlist{flex-direction:column;align-items:center;overflow:visible;padding:0 0 calc(20px + env(safe-area-inset-bottom))}
    #mlist .tcard{height:auto;width:min(68vw,520px)}
  }
  @media (max-height:430px){ .ctop{padding-top:6px} #close,.av2{width:42px;height:42px} .av2{font-size:22px} #ptitle{font-size:16px} .cbot .cbtn{width:42px;height:42px} .cbot{font-size:14px} }

  /* ======================== parents ======================== */
  #sheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
  #sheet.open{display:flex}
  #sheet .box{background:#212121;color:#fff;border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;
              padding:20px 22px calc(20px + env(safe-area-inset-bottom));font:15px/1.6 var(--font);-webkit-user-select:text;user-select:text}
  #sheet h3{margin:0 0 10px;font-size:20px}
  #sheet ul{padding-inline-start:20px;margin:8px 0}
  #sheet button{border:0;background:#3a3a3a;border-radius:20px;padding:9px 16px;cursor:pointer;margin:3px;font:500 15px var(--font)}
  #sheet button.primary{background:#f1f1f1;color:#0f0f0f}
  #gq{font-size:24px;margin:8px 0 12px}
  #ga{font:600 22px var(--font);width:120px;padding:8px 10px;border:0;border-radius:12px;text-align:center;background:#3a3a3a;color:#fff}
  #gerr{color:#ff6b6b;min-height:1.6em}
  .opt{display:flex;gap:12px;align-items:flex-start;background:#2c2c2c;border-radius:14px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:14px;line-height:1.5}
  .opt b{font-size:15px}
  .opt input{width:24px;height:24px;margin-top:2px;flex:0 0 auto;accent-color:#ff0033}
</style>
</head>
<body>

<div class="top">
  <div class="brand"><span class="logo">🦋</span>הטלוויזיה שלי</div>
  <div class="sp"></div>
  <button class="ib" id="shuffle" aria-label="לערבב"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
  <a class="ib" id="games" href="../kids-games/" aria-label="המשחקים שלי">🎮</a>
  <button class="ib" id="gear" aria-label="הגדרות להורים"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div>

<div id="view-home">
  <div id="chips"></div>
  <div class="feed" id="feed"></div>
  <button class="more-btn" id="moreBtn" hidden>עוד סרטונים</button>
</div>
<div id="view-search" hidden>
  <div id="searchbox"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="חיפוש" autocomplete="off"></div>
  <div class="feed" id="sfeed"></div>
</div>
<div id="view-mine" hidden>
  <div class="sect">🔁 לראות שוב</div>
  <div class="feed" id="mfeed"></div>
</div>

<nav class="bnav">
  <button class="bn on" data-view="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z"/></svg>דף הבית</button>
  <button class="bn" data-view="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>חיפוש</button>
  <button class="bn" data-view="mine"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>התוכן שלך</button>
  <button class="bn" id="profile"><span class="av">⭐</span>פרופיל</button>
</nav>

<div id="player" role="dialog" aria-modal="true">
  <div id="vid">
    <div id="yt-box"><div id="yt"></div></div>
    <div id="cover"></div>
    <div id="tap"></div>
    <div id="ctl">
      <div class="ctop c">
        <button class="cbtn" id="close" aria-label="חזרה"><svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg></button>
        <div class="av2" id="pav"></div>
        <div class="ttl"><div id="ptitle"></div><div id="pcat"></div></div>
      </div>
      <button class="cbtn c" id="next" aria-label="הסרטון הבא"><svg viewBox="0 0 24 24"><path d="M5 5.5v13a1 1 0 0 0 1.5.9l10-6.5a1 1 0 0 0 0-1.7l-10-6.5A1 1 0 0 0 5 5.5zM17.5 5h1.5a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-1.5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg></button>
      <div class="cbot c">
        <button class="cbtn" id="fs" aria-label="מסך מלא"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
        <button class="cbtn" id="pp" aria-label="נגן / עצור"></button>
        <span id="tcur">0:00</span>
        <div id="bar"><div class="track"><div id="fill"></div></div><div id="knob"></div></div>
        <span id="tdur">0:00</span>
      </div>
    </div>
    <div id="loading"><i></i></div>
    <div id="over"><div class="e" id="overE"></div><div id="overT"></div></div>
  </div>
  <div id="more"><h4>סרטונים נוספים</h4><div id="mlist"></div></div>
</div>

<div id="sheet">
  <div class="box">
    <div id="gate">
      <h3>🔒 רק להורים</h3>
      <div id="gq"></div>
      <input id="ga" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
      <button class="primary" id="gok">אישור</button> <button class="sclose">ביטול</button>
      <div id="gerr"></div>
    </div>
    <div id="pbody" hidden></div>
  </div>
</div>

<script>
/* ======================== הרשימה הסגורה ========================
   כדי להוסיף סרטון: מעתיקים את ה-ID מהקישור (youtube.com/watch?v=XXXXXXXXXXX)
   ומוסיפים שורה לקטגוריה המתאימה: ["ID", "שם הסרטון"],
   סרטון באנגלית: ["ID", "Title", "en"],
   min: אורך מינימלי בשניות לקטגוריה (ברירת מחדל 180)                       */
const CATS = [
  { id:"parpar", name:"פרפר נחמד", e:"🦋", c:"#ffb703", v:[
    ["n0mds3jvIIM","שבי והתותים"],
    ["V7TA8GopMYo","איך להיות חבר טוב"],
    ["lSC9sPSFLcA","בית לשיר של משי"],
    ["nRZqhOns3XM","משחקים במכולת"],
    ["kX82q6CDjB0","התחלות חדשות"],
    ["at7cJuNqjSs","אוזה והגשם הראשון"],
    ["FbJsx6-vkwA","זה קורה בירושלים (קלאסי)"],
  ]},
  { id:"hop", name:"ערוץ הופ! וסימון", e:"🐰", c:"#8ecae6", v:[
    ["TyMVmwQ0kfU","סימון – 5 פרקים ברצף"],
    ["nSj9tPxrExg","סימון – ספיישל סופר ארנב"],
    ["d4bq55GiawQ","סימון – השמיכי של אדם"],
    ["0nb911BPlk8","סימון – נשנוש עם סבתא זאב"],
    ["rOtKfs9A3p0","סימון – לא פוחדים מהחושך"],
    ["rBSJypfv9w8","סימון סופר ארנב"],
    ["5B7ycpgcN-s","סימון – משפחה שכזאת"],
    ["ZuOJT0bCGjM","מחרוזת שירי חנוכה - שירים של חג החנוכה לילדים"],
    ["KzxOhiRnfvE","הרפתקאות פיטר הארנב פרקים מלאים בעברית"],

/* ======================== מצב ======================== */
const MIN_SECONDS = 180, DAY = 864e5, PAGE = 40;
const store = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
let hidden = new Set(store.get('kidtv-hidden', []));
let current = store.get('kidtv-cat', 'all');
if(current!=='all' && !CATS.some(c=>c.id===current)) current='all';
let hist = store.get('kidtv-hist', []);   // [{id, c, t, p}], החדש ראשון
const byId = new Map(); for(const c of CATS) for(const v of c.v) if(!byId.has(v[0])) byId.set(v[0], {v, c});
const $ = id => document.getElementById(id);

/* ======================== ערבוב לפי צפיות ========================
   כל צפייה מוסיפה משקל לקטגוריה שלה; צפייה חדשה שווה יותר (חצי־חיים של 4 ימים),
   וצפייה עד הסוף שווה פי 2. סרטון שנצפה ב־3 הימים האחרונים מקבל משקל נמוך, כדי לגוון. */
function catWeights(){
  const w = {}; for(const c of CATS) w[c.id] = 1;
  const now = Date.now();
  for(const h of hist) if(h.c in w) w[h.c] += 4 * Math.pow(.5, (now - h.t)/DAY/4) * (h.p >= .6 ? 2 : 1);
  return w;
}
function lastSeen(){ const m = new Map(); for(const h of hist) if(!m.has(h.id)) m.set(h.id, h); return m; }
function vidWeight(id, seen){ const s = seen.get(id); if(!s) return 1; return (Date.now()-s.t)/DAY < 3 ? .25 : .7; }
function weightedShuffle(items, wf){ return items.map(x => [Math.pow(Math.random(), 1/Math.max(wf(x),1e-6)), x]).sort((a,b)=>b[0]-a[0]).map(p=>p[1]); }
let cache = {};
function reshuffle(){ cache = {}; }
function feedFor(catId){
  if(!cache[catId]){
    const seen = lastSeen(), cw = catWeights(), all = [];
    if(catId==='all'){
      /* "הכול": קודם 2 סרטונים שנצפו לאחרונה, ואז ערבוב משוקלל של כל הרשימה */
      const again = [...seen.values()].filter(h=>byId.has(h.id) && !hidden.has(h.id)).slice(0,2).map(h=>byId.get(h.id));
      const used = new Set(again.map(x=>x.v[0]));
      for(const c of CATS) for(const v of c.v) if(!hidden.has(v[0]) && !used.has(v[0])) all.push({v, c, w: cw[c.id] / Math.sqrt(c.v.length) * vidWeight(v[0], seen)});
      const out = [...again];
      for(const x of weightedShuffle(all, x=>x.w)) if(!used.has(x.v[0])){ used.add(x.v[0]); out.push(x); }
      cache[catId] = out;
    } else {
      const c = CATS.find(c=>c.id===catId);
      cache[catId] = weightedShuffle(c.v.filter(v=>!hidden.has(v[0])), v => vidWeight(v[0], seen)).map(v=>({v,c}));
    }
  }
  return cache[catId].filter(x=>!hidden.has(x.v[0]));
}
function recommendFor(id, cat, n){
  const cw = catWeights(), seen = lastSeen(), all = [];
  for(const c of CATS){
    const cwt = c.id === cat.id ? Math.max(cw[c.id], 3) * 3 : cw[c.id];
    for(const v of c.v) if(v[0]!==id && !hidden.has(v[0])) all.push({v, c, w: cwt / Math.sqrt(c.v.length) * vidWeight(v[0], seen)});
  }
  const out = [], used = new Set();
  for(const x of weightedShuffle(all, x=>x.w)){ if(used.has(x.v[0])) continue; used.add(x.v[0]); out.push(x); if(out.length>=n) break; }
  return out;
}

/* ======================== כרטיסים ======================== */
const fmt = s => { s = Math.max(0, Math.floor(s||0)); const h = Math.floor(s/3600), m = Math.floor(s/60)%60, ss = String(s%60).padStart(2,'0'); return h ? `${h}:${String(m).padStart(2,'0')}:${ss}` : `${m}:${ss}`; };
const KEBAB = '<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
function card(x, seen){
  const [id,title,lang] = x.v;
  const d = document.createElement('div'); d.className = 'card';
  const s = seen && seen.get(id), dur = DUR[id];
  d.innerHTML = `<div class="thumb"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/${id}/hqdefault.jpg">`+
    (dur ? `<span class="dur">${fmt(dur)}</span>` : '') +
    (s && s.p ? `<span class="prog"><i style="width:${Math.min(100,Math.round(s.p*100))}%"></i></span>` : '') +
    `</div><div class="meta"><div class="t"></div><button class="kebab" aria-label="עוד">${KEBAB}</button></div>`;
  d.querySelector('.t').textContent = title;
  if(lang==='en') d.querySelector('.t').insertAdjacentHTML('beforeend',' <small>· English</small>');
  d.onclick = () => openVideo(id, title, x.c);
  d.querySelector('.kebab').onclick = e => { e.stopPropagation(); askParent(() => blockSheet(x)); };
  return d;
}
function fillFeed(el, items, seen){ el.innerHTML = ''; if(!items.length) el.innerHTML = '<div class="empty">אין כאן סרטונים</div>'; for(const x of items) el.appendChild(card(x, seen)); }

/* ======================== דף הבית ======================== */
const ALL = {id:'all', name:'הכול', e:'🌈'};
let shown = PAGE;
function renderChips(){
  const el = $('chips'); el.innerHTML = '';
  const cw = catWeights();
  for(const c of [ALL, ...[...CATS].sort((a,b)=>cw[b.id]-cw[a.id])]){
    const b = document.createElement('button'); b.className = 'chip' + (current===c.id ? ' on' : '');
    b.innerHTML = `<span class="ci">${c.e}</span><span></span>`; b.lastChild.textContent = c.name;
    b.onclick = () => { current = c.id; store.set('kidtv-cat', current); shown = PAGE; renderChips(); renderFeed(); window.scrollTo({top:0}); };
    el.appendChild(b);
  }
  const on = el.querySelector('.on'); if(on) el.scrollLeft = on.offsetLeft - el.clientWidth + on.offsetWidth + 16;
}
function renderFeed(){
  const items = feedFor(current), seen = lastSeen();
  fillFeed($('feed'), items.slice(0, shown), seen);
  $('moreBtn').hidden = items.length <= shown;
}
/* גלילה אינסופית: כשמגיעים לסוף, נטענים עוד סרטונים */
$('moreBtn').onclick = () => { shown += PAGE; renderFeed(); };
new IntersectionObserver(es => { if(es[0].isIntersecting && !$('moreBtn').hidden && !$('view-home').hidden){ shown += PAGE; renderFeed(); } }, {rootMargin:'600px'}).observe($('moreBtn'));

/* ======================== חיפוש (רק בתוך הרשימה הסגורה) ======================== */
const norm = s => s.toLowerCase().replace(/[֑-ׇ'"״׳]/g,'');
$('q').addEventListener('input', () => {
  const q = norm($('q').value.trim()); const out = [];
  if(q) for(const c of CATS){
    const catHit = norm(c.name).includes(q);
    for(const v of c.v) if(!hidden.has(v[0]) && (catHit || norm(v[1]).includes(q))) out.push({v,c});
  }
  fillFeed($('sfeed'), out.slice(0, 80), lastSeen());
  if(!q) $('sfeed').innerHTML = '';
});

/* ======================== התוכן שלך ======================== */
function renderMine(){
  const seen = lastSeen();
  const items = [...seen.values()].filter(h=>byId.has(h.id) && !hidden.has(h.id)).slice(0,60).map(h=>byId.get(h.id));
  fillFeed($('mfeed'), items, seen);
  if(!items.length) $('mfeed').innerHTML = '<div class="empty">עוד לא ראית סרטונים 🙂</div>';
}

/* ======================== ניווט תחתון ======================== */
let view = 'home';
function setView(v){
  view = v;
  for(const n of ['home','search','mine']) $('view-'+n).hidden = n !== v;
  document.querySelectorAll('.bn[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  if(v==='mine') renderMine();
  if(v==='search') setTimeout(()=>$('q').focus(), 50);
  window.scrollTo({top:0});
}
document.querySelectorAll('.bn[data-view]').forEach(b => b.onclick = () => { if(b.dataset.view==='home' && view==='home'){ window.scrollTo({top:0,behavior:'smooth'}); return; } setView(b.dataset.view); });
function refreshAll(){ reshuffle(); renderChips(); renderFeed(); if(view==='mine') renderMine(); }

/* ======================== היסטוריה ======================== */
function logView(id, catId){
  hist = hist.filter(h=>!(h.id===id && Date.now()-h.t < 6*36e5)); // אותו סרטון שוב באותו בוקר = צפייה אחת
  hist.unshift({id, c:catId, t:Date.now(), p:0});
  hist = hist.slice(0, 300); store.set('kidtv-hist', hist);
}
function logProgress(id, p){
  const h = hist.find(h=>h.id===id); if(!h) return;
  if(p > (h.p||0) + .01 || p===1){ h.p = Math.round(p*100)/100; store.set('kidtv-hist', hist); }
}

/* הגדרות (נשמרות במכשיר): המלצות בזמן צפייה, סיבוב אוטומטי לרוחב */
let settings = Object.assign({recs:true, rotate:true}, store.get('kidtv-settings', {}));

function drawProgress(t, d){
  const f = d ? Math.min(1, Math.max(0, t/d)) : 0;
  fill.style.width = (f*100)+'%'; knob.style.left = (f*100)+'%';
  tcur.textContent = fmt(t); tdur.textContent = fmt(d);

function showUI(){
  P.classList.add('ui'); clearTimeout(uiTimer);
  if(P.classList.contains('playing')) uiTimer = setTimeout(()=>{ if(!dragging && P.classList.contains('playing')) P.classList.remove('ui'); }, 4000);
}

function enterFull(){
  const f = document.documentElement;
  if(document.fullscreenElement || !f.requestFullscreen) return;
  f.requestFullscreen({navigationUI:'hide'}).then(()=>{ if(settings.rotate) try{ screen.orientation.lock('landscape').catch(()=>{}) }catch(_){} }).catch(()=>{});
}

function thumbCard(x){
  const b = document.createElement('button'); b.className = 'tcard';
  const s = lastSeen().get(x.v[0]), dur = DUR[x.v[0]];
  b.innerHTML = `<img loading="lazy" alt="" src="https://i.ytimg.com/vi/${x.v[0]}/hqdefault.jpg">` +
    (dur ? `<span class="dur">${fmt(dur)}</span>` : '') +
    (s && s.p ? `<span class="prog"><i style="width:${Math.min(100,Math.round(s.p*100))}%"></i></span>` : '');
  b.setAttribute('aria-label', x.v[1]);
  b.onclick = e => { e.stopPropagation(); openVideo(x.v[0], x.v[1], x.c); };
  return b;
}

function openVideo(id, title, cat){
  const first = !P.classList.contains('open');
  P.classList.add('open'); P.classList.remove('playing','ui');
  P.classList.toggle('norecs', !settings.recs);
  document.documentElement.style.overflow = 'hidden';
  if(first && settings.rotate) enterFull();
  ended = false; setPP(); over.classList.remove('show'); loading.classList.add('show');
  $('ptitle').textContent = title; $('pcat').textContent = cat.name;
  $('pav').textContent = cat.e; $('pav').style.setProperty('--cc', cat.c);
  cover.style.backgroundImage = `url(https://i.ytimg.com/vi/${id}/hqdefault.jpg)`;
  drawProgress(0, DUR[id] || 0);
  curId = id; curCat = cat; checked = false;
  recs = settings.recs ? recommendFor(id, cat, 20) : [];
  const ml = $('mlist'); ml.innerHTML = ''; recs.forEach(x => ml.appendChild(thumbCard(x)));
  ml.scrollLeft = 0; P.scrollTop = 0;
  if(location.protocol === 'file:'){ loading.classList.remove('show'); showOver('🏠','צריך לפתוח את האתר דרך קובץ ההפעלה (start-windows.bat או start-mac.command)'); return; }
  if(!apiReady){ pending=[id,title,cat]; return; }
  if(player && player.loadVideoById){ player.loadVideoById(id); return; }
  player = new YT.Player('yt', {
    host: 'https://www.youtube-nocookie.com',
    videoId: id,
    playerVars: { autoplay:1, controls:0, disablekb:1, fs:0, rel:0, iv_load_policy:3, playsinline:1, modestbranding:1, cc_load_policy:0, hl:'iw', origin: location.origin },
    events: {
      onReady: e => { try{ e.target.playVideo() }catch(_){} setTimeout(()=>{ if(!P.classList.contains('playing')){ loading.classList.remove('show'); showUI(); } }, 2500); },
      onStateChange: onState,
      onError: onErr
    }
  });
}
function onState(e){
  const S = YT.PlayerState;
  if(e.data === S.PLAYING){
    loading.classList.remove('show'); over.classList.remove('show'); ended = false;
    if(!checked){
      checked = true;
      const d = player.getDuration();
      if(d > 0 && d < (curCat.min || MIN_SECONDS)){ player.stopVideo(); hideVideo(curId); showOver('⏱️','הסרטון הזה קצר מדי. בואי נבחר אחר!'); return; }
      logView(curId, curCat.id); dirty = true;
    }
    setPlaying(true);
    clearInterval(tick);
    tick = setInterval(()=>{ if(dragging) return; try{ const d=player.getDuration(), t=player.getCurrentTime(); drawProgress(t, d); if(d) logProgress(curId, t/d); }catch(_){ } }, 250);
  } else if(e.data === S.ENDED){
    clearInterval(tick); ended = true; logProgress(curId, 1);
    try{ drawProgress(player.getDuration(), player.getDuration()); }catch(_){}
    setPlaying(false);   // בלי ניגון אוטומטי: מופיעים הפקדים (וההמלצות, אם הן פעילות)
  } else if(e.data === S.BUFFERING){
    if(!P.classList.contains('playing')) loading.classList.add('show');
  } else if(e.data === S.PAUSED || e.data === S.CUED){
    clearInterval(tick); loading.classList.remove('show'); setPlaying(false);
  }
}
function onErr(){ loading.classList.remove('show'); hideVideo(curId); showOver('🙈','את הסרטון הזה אי אפשר לראות כאן. בואי נבחר אחר!'); }
function hideVideo(id){ hidden.add(id); store.set('kidtv-hidden',[...hidden]); hist = hist.filter(h=>h.id!==id); store.set('kidtv-hist', hist); dirty = true; }

/* ---- פקדים ---- */
function togglePlay(){
  if(!player || !player.getPlayerState) return;
  if(ended){ ended = false; player.seekTo(0, true); player.playVideo(); return; }
  if(player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo(); else player.playVideo();
}
/* נגיעה במסך: מציגה פקדים (ולרוחב – מקטינה את הסרטון ומציגה עוד סרטונים); נגיעה נוספת מסתירה */
$('tap').onclick = () => {
  if(over.classList.contains('show')) return;
  if(P.classList.contains('ui') && P.classList.contains('playing')) hideUI(); else showUI();
};
pp.onclick = e => { e.stopPropagation(); togglePlay(); };
$('next').onclick = e => { e.stopPropagation(); if(recs[0]) openVideo(recs[0].v[0], recs[0].v[1], recs[0].c); };
function skip(sec){ if(!player || !player.getCurrentTime) return; const d = player.getDuration(), t = Math.min(Math.max(0, player.getCurrentTime()+sec), Math.max(0,d-1)); ended = false; player.seekTo(t, true); drawProgress(t, d); setPP(); }
function barFrac(ev){ const r = bar.getBoundingClientRect(); return Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)); }
bar.addEventListener('pointerdown', ev => {
  if(!player || !player.getDuration || !player.getDuration()) return;
  dragging = true; bar.setPointerCapture(ev.pointerId); clearTimeout(uiTimer);
  const d = player.getDuration(); drawProgress(barFrac(ev)*d, d);
});
bar.addEventListener('pointermove', ev => { if(!dragging) return; const d = player.getDuration(); drawProgress(barFrac(ev)*d, d); });
function endDrag(ev){ if(!dragging) return; dragging = false; const d = player.getDuration(); ended = false; player.seekTo(barFrac(ev)*d, true); setPP(); showUI(); }
bar.addEventListener('pointerup', endDrag); bar.addEventListener('pointercancel', endDrag);
$('mlist').addEventListener('scroll', () => { if(P.classList.contains('ui')) showUI(); }, {passive:true});

function closePlayer(){
  clearInterval(tick); clearTimeout(uiTimer);
  try{ player && player.stopVideo && player.stopVideo() }catch(_){}
  exitFull();
  P.classList.remove('open','playing','ui'); loading.classList.remove('show'); document.documentElement.style.overflow = '';
  /* כשחוזרים לדף הבית, ההמלצות מתעדכנות לפי מה שנצפה עכשיו */
  if(dirty){ dirty = false; refreshAll(); }
}
$('close').onclick = e => { e.stopPropagation(); closePlayer(); };
/* כפתור מסך מלא: נכנס/יוצא ממסך מלא ומסובב לרוחב/לאורך */
$('fs').onclick = e => {
  e.stopPropagation();
  if(document.fullscreenElement) exitFull();
  else { const f = document.documentElement; if(f.requestFullscreen) f.requestFullscreen({navigationUI:'hide'}).then(()=>{ try{ screen.orientation.lock('landscape').catch(()=>{}) }catch(_){} }).catch(()=>{}); }
  showUI();
};
window.addEventListener('popstate', () => { if(P.classList.contains('open')) closePlayer(); });
document.addEventListener('keydown', e => {
  if(!P.classList.contains('open')) return;
  if(e.key === 'Escape') closePlayer();
  else if(e.key === ' '){ e.preventDefault(); togglePlay(); }
  else if(e.key === 'ArrowLeft') skip(-10);
  else if(e.key === 'ArrowRight') skip(10);
});

/* ======================== הורים: שאלת חשבון לפני כל הגדרה ======================== */
let gateAns = 0, gateThen = null;
function askParent(then){
  const a = 3 + Math.floor(Math.random()*7), b = 3 + Math.floor(Math.random()*7); gateAns = a*b; gateThen = then;
  $('gq').textContent = `כמה זה ${a} × ${b}?`; $('ga').value = ''; $('gerr').textContent = '';
  $('gate').hidden = false; $('pbody').hidden = true; $('sheet').classList.add('open'); setTimeout(()=>$('ga').focus(), 50);
}
function gateCheck(){ if(+$('ga').value === gateAns){ $('gate').hidden = true; $('pbody').hidden = false; gateThen && gateThen(); } else { $('gerr').textContent = 'לא נכון, נסו שוב'; $('ga').value=''; } }
$('gok').onclick = gateCheck;
$('ga').addEventListener('keydown', e => { if(e.key==='Enter') gateCheck(); });
const closeSheet = () => $('sheet').classList.remove('open');
$('sheet').addEventListener('click', e => { if(e.target === $('sheet') || e.target.classList.contains('sclose')) closeSheet(); });
function blockSheet(x){
  $('pbody').innerHTML = `<h3>🚫 לחסום את הסרטון?</h3><p></p><button class="primary" id="doBlock">לחסום</button> <button class="sclose">ביטול</button>`;
  $('pbody').querySelector('p').textContent = x.v[1];
  $('doBlock').onclick = () => { hideVideo(x.v[0]); dirty = false; closeSheet(); refreshAll(); };
}
function parentsSheet(){
  $('pbody').innerHTML = `  <h3>⚙️ הגדרות</h3>
  <label class="opt"><input type="checkbox" id="optRecs"> <span><b>סרטונים מומלצים בזמן צפייה</b><br>נגיעה במסך מציגה עוד סרטונים לבחירה, וכפתור "הבא". כשההגדרה כבויה, הנגיעה מציגה רק את הפקדים.</span></label>
  <label class="opt"><input type="checkbox" id="optRot"> <span><b>מסך מלא ולרוחב אוטומטית</b><br>כשבוחרים סרטון, הוא נפתח במסך מלא ומסתובב לרוחב. באייפון הדפדפן לא מאפשר לסובב לבד, ולכן צריך לסובב את הטלפון ביד.</span></label>
<h3 style="margin-top:18px">👨‍👩‍👧 להורים</h3><ul>
    <li>יש כאן <b>${byId.size - hidden.size}</b> סרטונים שנבחרו מראש מערוצים רשמיים: ערוץ הופ!, ערוץ בייבי, כאן חינוכית, ניק ג׳וניור, יובל המבולבל, נופיקי ועוד כוכבי ילדים, ילדות ישראלית, שלומי וסתם, רחלי הקטנה, בקטנה (פרשת השבוע), ערוץ אלף, מקהלות ילדים חסידיות, ניגוני חב״ד לתינוקות, צופי, טוטיטו, רותמאמא, מאשה והדוב, קוקומלון, Bluey, Peppa Pig ו־Super Simple Songs. כ־90% מהם בעברית.</li>
    <li>"הכול" מתחיל בסרטונים שנצפו לאחרונה, ואחריהם מגיע ערבוב לפי מה שהילדה אוהבת. הקטגוריות שהיא צופה בהן הכי הרבה עולות קדימה. החיפוש מחפש רק בתוך הרשימה הסגורה.</li>
    <li>כמו באפליקציה: סרטון נפתח במסך מלא ולרוחב, ונגיעה במסך מציגה פקדים ועוד סרטונים לבחירה, אבל רק מהרשימה הסגורה. אפשר לכבות את ההמלצות בהגדרות למעלה. אין ניגון אוטומטי של הסרטון הבא, והנגן מכוסה בשכבת מגע כך שאי אפשר לצאת ליוטיוב.</li>
    <li>⋮ ליד סרטון ← חסימה של הסרטון (אחרי שאלת חשבון).</li>
    <li>סרטון קצר מ־3 דקות (בפרשת השבוע ובערוץ אלף: מ־2 דקות), או שהיוצר שלו חסם הטמעה, יוסתר אוטומטית בפעם הראשונה שמנסים לנגן אותו.</li>
    <li>ההיסטוריה נשמרת רק בדפדפן הזה. "הוסף למסך הבית" בדפדפן הופך את האתר לאייקון שנפתח במסך מלא.</li>
    <li>יוטיוב עדיין עלול להציג פרסומות בתוך חלק מהסרטונים. אפשר לחסום אותן עם YouTube Premium או חוסם פרסומות בדפדפן.</li>
  </ul>
  <p><button id="reset">להחזיר סרטונים שהוסתרו (${hidden.size})</button><br><button id="clearHist">לנקות היסטוריית צפייה (${hist.length})</button></p>
  <button class="primary sclose">סגירה</button>`;
  $('optRecs').checked = settings.recs; $('optRot').checked = settings.rotate;
  $('optRecs').onchange = e => { settings.recs = e.target.checked; store.set('kidtv-settings', settings); };
  $('optRot').onchange = e => { settings.rotate = e.target.checked; store.set('kidtv-settings', settings); };
  $('reset').onclick = () => { hidden = new Set(); store.set('kidtv-hidden',[]); closeSheet(); refreshAll(); };
  $('clearHist').onclick = () => { if(!confirm('לנקות את היסטוריית הצפייה?')) return; hist = []; store.set('kidtv-hist',[]); closeSheet(); refreshAll(); };
}
$('gear').onclick = $('profile').onclick = () => askParent(parentsSheet);
$('shuffle').onclick = () => { reshuffle(); shown = PAGE; renderFeed(); window.scrollTo({top:0,behavior:'smooth'}); };

renderChips(); renderFeed();
</script>
